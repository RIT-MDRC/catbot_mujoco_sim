[project]
name = "catbot-mujoco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "marimo>=0.24.0",
    "mujoco>=3.9.0",
    "pillow>=12.2.0",
    "ruff>=0.15.16",
    "starlette>=0.51.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
notebook = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
