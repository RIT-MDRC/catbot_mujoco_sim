# Catbot mjlab environment defaults. CLI runtime arguments override these values.
num_envs: 256
device: cuda:0
seed: 0
max_episode_length: 1000
frame_skip: 10
action_smoothing: 0.8
domain_randomization: false
tracking_weight: 1.0
upright_weight: 0.5
# Tilt costs 0.5 at 10 degrees, approximately 2.0 at 20 degrees.
tilt_weight: 0.5
tilt_reference_degrees: 10.0
# Penalize body roll/pitch angular speed squared; yaw turns are excluded.
tilt_rate_weight: 0.05
height_weight: 0.3
# Allowed absolute angular travel per cadence window, as fraction of usable range.
motion_budget: 0.5
motion_budget_weight: 1.0
control_weight: 0.015
action_rate_weight: 0.1
foot_drag_weight: 0.05
# Grounded foot centers may lie within this radius of the projected hip (meters).
stance_radius: 0.10
# Mean over four feet of squared excess distance divided by radius squared.
stance_boundary_weight: 0.5
foot_clearance_weight: 0.2
foot_clearance_target: 0.06
action_acceleration_weight: 0.5
air_time_weight: 0.2
air_time_min: 0.12
air_time_max: 0.35
air_time_limit: 0.7
prolonged_swing_weight: 0.5
min_support_feet: 2
support_deficit_weight: 0.5
gait_contact_weight: 0.8
trot_speed: 0.35
bound_speed: 0.6
gait_transition_seconds: 0.5
command_interval: 250
